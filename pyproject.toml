[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scratch3dnn"
version = "0.1.0"
description = "A neural network framework built from scratch using NumPy."
authors = [
  {name = "Tridibesh Sarkar", email = "tridibeshsarkar07@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24"
]

[tool.setuptools.packages.find]
where = ["src"]